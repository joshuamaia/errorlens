# ErrorLens - Nginx: serve o frontend Angular e faz proxy reverso da API (mesma origem, sem CORS).
upstream errorlens_backend {
    server errorlens-backend:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 3m;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # API, OpenAPI e Swagger UI do backend
    location ~ ^/(api|v3/api-docs|swagger-ui) {
        proxy_pass http://errorlens_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location = /swagger-ui.html {
        proxy_pass http://errorlens_backend;
        proxy_set_header Host $host;
    }

    # Arquivos com hash: cache longo
    location ~* \.(?:js|css|woff2?|ttf|svg|png|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: rotas do Angular
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
